<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tudo 的個人連結頁：數學、程式、BanG Dream! 與各種專案。" />
  <meta name="theme-color" content="#102d29" />
  <title>Tudo Links</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.20.6/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" defer></script>

  <style>
    :root {
      --bg: #0a211e;
      --bg-deep: #061512;
      --panel: rgba(18, 52, 47, 0.78);
      --panel-hover: rgba(24, 69, 62, 0.93);
      --text: #f5f3e8;
      --muted: #b9c9c4;
      --line: rgba(240, 245, 236, 0.15);
      --blue: #9bd7ff;
      --pink: #ffafd0;
      --yellow: #ffe099;
      --green: #9ee7c4;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(70, 144, 124, 0.25), transparent 32%),
        radial-gradient(circle at 82% 18%, rgba(82, 112, 164, 0.16), transparent 28%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-deep) 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: screen;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(255,255,255,0.05) 4px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 5px,
          rgba(255,255,255,0.025) 6px
        );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    #root {
      min-height: 100vh;
    }

    .page {
      position: relative;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 54px 20px 72px;
    }

    .chalk {
      position: absolute;
      z-index: -1;
      color: rgba(255,255,255,0.12);
      font-family: "Comic Sans MS", "Bradley Hand", cursive;
      font-weight: 700;
      user-select: none;
      pointer-events: none;
      filter: blur(0.2px);
    }

    .chalk.one {
      top: 52px;
      left: -52px;
      font-size: 50px;
      transform: rotate(-8deg);
    }

    .chalk.two {
      top: 210px;
      right: -68px;
      font-size: 42px;
      transform: rotate(7deg);
    }

    .chalk.three {
      bottom: 90px;
      left: -78px;
      font-size: 38px;
      transform: rotate(5deg);
    }

    .profile {
      text-align: center;
      margin-bottom: 34px;
    }

    .avatar {
      width: 108px;
      height: 108px;
      margin: 0 auto 18px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      position: relative;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05)),
        #153e37;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.18);
      transform: rotate(-2deg);
    }

    .avatar::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 21px;
      border: 1px dashed rgba(255,255,255,0.28);
    }

    .avatar span {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -3px;
      transform: rotate(2deg);
    }

    .name {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 0.95;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: -0.06em;
      text-shadow: 0 2px 0 rgba(255,255,255,0.1);
    }

    .tagline {
      margin: 15px auto 7px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
      max-width: 560px;
    }

    .formula {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 11px;
      color: var(--yellow);
      font-family: "Times New Roman", serif;
      font-style: italic;
      font-size: 1.03rem;
      border-bottom: 2px solid rgba(255, 175, 208, 0.58);
      padding-bottom: 5px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 31px 4px 13px;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .card {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 30px;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 92px;
      padding: 18px;
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02)),
        var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
      text-align: left;
      color: inherit;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-3px);
      background:
        linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)),
        var(--panel-hover);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 16px 38px rgba(0,0,0,0.26);
    }

    .card:focus-visible {
      outline: 3px solid rgba(155, 215, 255, 0.65);
      outline-offset: 3px;
    }

    .icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 1.34rem;
      color: #102d29;
      background: var(--accent, var(--green));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
    }

    .card-copy .icon {
      color: var(--text);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .card-main {
      min-width: 0;
    }

    .card-title {
      margin: 0 0 5px;
      font-size: 1.04rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .card-description {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.48;
    }

    .arrow {
      justify-self: end;
      color: rgba(255,255,255,0.45);
      font-size: 0.88rem;
      transition: transform 180ms ease, color 180ms ease;
    }

    .card:hover .arrow {
      transform: translateX(4px);
      color: var(--text);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 20;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 18px;
      border-radius: 999px;
      color: #102d29;
      background: var(--green);
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      font-weight: 800;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .footer {
      margin-top: 36px;
      color: rgba(245,243,232,0.45);
      text-align: center;
      font-size: 0.8rem;
      line-height: 1.8;
    }

    .footer code {
      color: rgba(255,224,153,0.82);
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    @media (max-width: 560px) {
      .page {
        padding-top: 34px;
      }

      .avatar {
        width: 92px;
        height: 92px;
      }

      .avatar span {
        font-size: 38px;
      }

      .card {
        grid-template-columns: 46px minmax(0, 1fr) 22px;
        gap: 12px;
        padding: 15px;
        border-radius: 19px;
      }

      .icon {
        width: 46px;
        height: 46px;
        border-radius: 14px;
      }

      .chalk {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const projectLinks = [
      {
        icon: "fa-solid fa-square-root-variable",
        title: "BuzzCalculus",
        description: "微積分、數學內容與互動工具",
        url: "https://tudohuang.github.io/BuzzCalculus/",
        accent: "#ffe099"
      },
      {
        icon: "fa-solid fa-magnifying-glass",
        title: "Bandori Hunter",
        description: "搜尋 BanG Dream! 商品與收藏資訊",
        url: "https://bandori-hunter.vercel.app/",
        accent: "#ffafd0"
      },
      {
        icon: "fa-solid fa-book-open",
        title: "邦邦來台圖鑑",
        description: "整理 BanG Dream! 來台活動與紀錄",
        url: "https://bangdream-collection-tw.vercel.app/",
        accent: "#9bd7ff"
      },
      {
        icon: "fa-solid fa-border-all",
        title: "SoftwareHub",
        description: "活動、軟體、網站與開發框架",
        url: "https://tudohuang.github.io/SoftaForDev",
        accent: "#9ee7c4"
      },
      {
        icon: "fa-solid fa-dice",
        title: "RNG",
        description: "線上隨機工具與賓果",
        url: "https://tudohuang.github.io/Crazy-randomv2/",
        accent: "#c8b6ff"
      },
      {
        icon: "fa-solid fa-globe",
        title: "個人網站",
        description: "瀏覽我的其他作品與專案",
        url: "https://tudohuang.github.io/",
        accent: "#a8e6cf"
      }
    ];

    const socialLinks = [
      {
        icon: "fa-brands fa-threads",
        title: "Threads",
        description: "@tsty1215.bdforever",
        url: "https://www.threads.com/@tsty1215.bdforever",
        accent: "#f5f3e8"
      }
    ];

    function LinkCard({ item }) {
      return (
        <a
          className="card"
          href={item.url}
          target="_blank"
          rel="noopener noreferrer"
          style={{ "--accent": item.accent }}
          aria-label={`開啟 ${item.title}`}
        >
          <span className="icon" aria-hidden="true">
            <i className={item.icon}></i>
          </span>

          <span className="card-main">
            <h2 className="card-title">{item.title}</h2>
            <p className="card-description">{item.description}</p>
          </span>

          <span className="arrow" aria-hidden="true">
            <i className="fa-solid fa-arrow-up-right-from-square"></i>
          </span>
        </a>
      );
    }

    function App() {
      const [toastVisible, setToastVisible] = React.useState(false);
      const timerRef = React.useRef(null);

      const copyDiscord = async () => {
        const username = "tudo_huang11";

        try {
          await navigator.clipboard.writeText(username);
        } catch {
          const textarea = document.createElement("textarea");
          textarea.value = username;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }

        setToastVisible(true);
        window.clearTimeout(timerRef.current);
        timerRef.current = window.setTimeout(() => {
          setToastVisible(false);
        }, 1800);
      };

      React.useEffect(() => {
        return () => window.clearTimeout(timerRef.current);
      }, []);

      return (
        <main className="page">
          <div className="chalk one" aria-hidden="true">∫ x dx</div>
          <div className="chalk two" aria-hidden="true">e<sup>jωt</sup></div>
          <div className="chalk three" aria-hidden="true">Σ 1/n²</div>

          <header className="profile">
            <div className="avatar" aria-hidden="true">
              <span>Tu</span>
            </div>

            <h1 className="name">Tudo</h1>

            <p className="tagline">
              Math × Coding × Hardware × BanG Dream!
              <br />
            </p>

            <div className="formula">
              <span>lim</span>
              <span style={{ fontSize: "0.78em" }}>t→∞</span>
              <span>BanG Dream!(t) = Forever</span>
            </div>
          </header>

          <div className="section-title">Projects</div>
          <section className="links" aria-label="專案連結">
            {projectLinks.map((item) => (
              <LinkCard key={item.title} item={item} />
            ))}
          </section>

          <div className="section-title">Social</div>
          <section className="links" aria-label="社群連結">
            <button
              type="button"
              className="card card-copy"
              onClick={copyDiscord}
              aria-label="複製 Discord 使用者名稱 tudo_huang11"
            >
              <span className="icon" aria-hidden="true">
                <i className="fa-brands fa-discord"></i>
              </span>

              <span className="card-main">
                <h2 className="card-title">Discord</h2>
                <p className="card-description">tudo_huang11 · 點一下複製</p>
              </span>

              <span className="arrow" aria-hidden="true">
                <i className="fa-regular fa-copy"></i>
              </span>
            </button>

            {socialLinks.map((item) => (
              <LinkCard key={item.title} item={item} />
            ))}
          </section>


          <div
            className={`toast ${toastVisible ? "show" : ""}`}
            role="status"
            aria-live="polite"
          >
            已複製 Discord：tudo_huang11
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
